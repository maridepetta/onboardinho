<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<base target="_top">
<title>Onboardinho</title>
<script>
// Se o código abaixo não rodar (arquivo colado pela metade, erro de JavaScript), mostra o motivo
// em vez de deixar a página em branco. Usa só estilos inline: o CSS também pode ter sido cortado.
(function () {
  function mostrar(titulo, texto) {
    var caixa = document.getElementById('erro-carga');
    if (!caixa) {
      caixa = document.createElement('div');
      caixa.id = 'erro-carga';
      caixa.setAttribute('role', 'alert');
      caixa.style.cssText = 'max-width:640px;margin:48px auto;padding:24px;font:16px/1.5 system-ui,sans-serif;color:#201e1d;background:#fff2ef;border-left:4px solid #ae1800';
      (document.body || document.documentElement).appendChild(caixa);
    }
    caixa.textContent = '';
    var h = document.createElement('strong');
    h.textContent = titulo;
    h.style.cssText = 'display:block;font-size:20px;margin-bottom:8px';
    var p = document.createElement('p');
    p.textContent = texto;
    p.style.cssText = 'margin:0;white-space:pre-line';
    caixa.appendChild(h);
    caixa.appendChild(p);
  }
  var DICA = 'Provável causa: o Index.html foi colado pela metade. No editor do Apps Script, cole o Index.html de novo, ' +
    'role até o fim e confira se a última linha é </html>. Salve e recarregue esta página.';
  window.addEventListener('error', function (ev) {
    var msg = (ev && ev.message) || 'erro desconhecido';
    var incompleto = /end of input|Unexpected end|unterminated/i.test(msg);
    mostrar(incompleto ? 'O Index.html está incompleto.' : 'O app encontrou um erro e parou.',
      (incompleto ? DICA : 'Mande este texto para quem cuida do app:') + '\n\n' + msg + (ev && ev.lineno ? ' (linha ' + ev.lineno + ')' : ''));
  });
  setTimeout(function () {
    if (!window.__onboardinhoIniciou) mostrar('O app não começou a carregar.', DICA);
  }, 6000);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
/* Tokens do design system Modernist. Botões em #d02a11 (não #ec3013) para o texto claro ter contraste 4.5:1. */
:root {
  --bg: #f3f2f2; --surface: #eae9e9; --text: #201e1d; --accent: #ec3013;
  --divider: rgba(32, 30, 29, 0.4); --field: #7d7979;
  --n200: #eae7e7; --n300: #d7d3d3; --n600: #7d7979; --n700: #605d5d; --n800: #444141;
  --a100: #fff2ef; --a400: #ff9783; --a700: #ae1800; --a800: #7c1405;
  --action: #d02a11; --action-hover: #ae1800;
  --gutter: clamp(16px, 3.2vw, 40px);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "Archivo", system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; }
a { color: var(--text); font-weight: 600; text-underline-offset: 3px; }
a:hover { color: var(--action); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.brand { font-weight: 800; font-size: 18px; }
.kicker { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--a700); }
.title { margin: 0; font-weight: 800; font-size: clamp(40px, 5vw, 64px); line-height: 1; letter-spacing: -0.035em; }
.big { margin: 0; font-weight: 800; font-size: clamp(44px, 6.5vw, 88px); line-height: .95; letter-spacing: -0.045em; }
.lead { margin: 0; max-width: 640px; font-size: 16px; color: var(--n800); }
.muted { margin: 0; color: var(--n700); font-size: 13px; }
.h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 10px 16px; border-radius: 0; font-weight: 800; font-size: 14px; text-align: left; cursor: pointer; }
.btn-primary { border: 0; background: var(--action); color: var(--bg); }
.btn-primary:hover { background: var(--action-hover); }
.btn-secondary { border: 1px solid var(--field); background: transparent; color: var(--text); }
.btn-secondary:hover { background: var(--n200); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-wide { min-width: 240px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label, legend { font-size: 12px; color: var(--n700); }
.input { min-height: 44px; padding: 6px 10px; border: 1px solid var(--field); border-radius: 0; background: var(--surface); color: var(--text); font-size: 14px; }
.input:focus-visible { border-color: var(--accent); outline-offset: 0; }
textarea.input { min-height: 80px; resize: vertical; }
fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-wrap: wrap; gap: 4px 20px; }
legend { margin-bottom: 6px; padding: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--action); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 24px; }
.full { grid-column: 1 / -1; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 12px 16px; background: var(--text); color: var(--bg); font-weight: 600; z-index: 10; }
.toast.erro { background: var(--a700); }
.notice { margin: 0; padding: 12px 16px; border-left: 4px solid var(--text); background: var(--surface); font-size: 14px; }
.warn { margin: 0; padding: 12px 16px; background: var(--a100); color: var(--a700); font-size: 14px; }
.empty { margin: 0; padding: 32px 24px; border: 1px dashed var(--divider); color: var(--n700); }

/* Telas cheias (carregando, sem acesso, primeiro acesso) */
.full-screen { min-height: 100vh; display: flex; flex-direction: column; }
.full-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px var(--gutter); border-bottom: 2px solid var(--divider); font-size: 13px; }
.full-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; max-width: 1180px; padding: 48px var(--gutter); }
.full-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 16px var(--gutter); border-top: 2px solid var(--divider); }
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 4px; }
.card { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 180px; padding: 20px; }
.card.on { background: var(--text); color: var(--bg); border-top: 6px solid var(--text); }
.card.off { border: 2px dashed var(--divider); border-top: 6px solid var(--n300); color: var(--n700); }
.card-top { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.card.on .card-top { color: var(--a400); }
.card-value { font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.03em; }
.card-seg { font-weight: 800; font-size: 64px; line-height: .9; letter-spacing: -0.045em; }

/* App */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; padding: 16px var(--gutter); border-bottom: 2px solid var(--divider); }
.nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 24px; flex: 1; }
.nav button { padding: 8px 0; border: 0; background: none; color: var(--text); font-size: 14px; cursor: pointer; white-space: nowrap; }
.nav button[aria-current="page"] { color: var(--a700); font-weight: 600; }
.nav button:hover { color: var(--a700); }
.who { padding-left: 24px; border-left: 2px solid var(--divider); font-size: 13px; }
@media (max-width: 720px) { .nav { order: 3; flex-basis: 100%; justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; } .who { padding-left: 0; border-left: 0; } }
.page { max-width: 1280px; padding: 36px var(--gutter) 80px; display: flex; flex-direction: column; gap: 28px; }
.panel { padding-top: 20px; border-top: 2px solid var(--text); display: flex; flex-direction: column; gap: 16px; }
.form.panel { display: grid; }

/* Início (2a): briefing em grid */
.brief { display: flex; flex-direction: column; min-height: calc(100vh - 72px); }
.brief-hello { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px 24px; align-items: end; padding: 36px var(--gutter) 28px; }
.brief-hello > :first-child { grid-column: span 8; display: flex; flex-direction: column; gap: 10px; }
.brief-hello > :last-child { grid-column: span 4; }
.brief-h1 { margin: 0; font-size: clamp(36px, 5vw, 64px); font-weight: 800; line-height: 1; letter-spacing: -0.035em; }
.brief-h1 span { display: block; }
.brief-side .tags { margin: 0 0 10px; }
.brief-side p { margin: 0; font-size: 14px; color: var(--n800); }
.tag-solid { padding: 5px 10px; background: var(--action); color: var(--bg); font-size: 12px; }
.tag-outline { padding: 4px 10px; border: 1px solid var(--field); font-size: 12px; }
.pipeline { list-style: none; margin: 0 var(--gutter); padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 1px; background: var(--divider); border-top: 2px solid var(--text); border-bottom: 2px solid var(--divider); }
.pipeline li { padding: 12px 14px; background: var(--bg); }
.pipeline span { display: block; font-size: 12px; line-height: 1.3; }
.pipeline strong { display: block; margin-top: 6px; font-size: 30px; font-weight: 800; line-height: 1; }
.pipeline .zero strong { color: var(--n600); }
.pipeline .hot { background: var(--action); color: var(--bg); }
.brief-cols { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 var(--gutter); }
.brief-col { min-width: 0; padding: 24px 24px 32px; }
.brief-col:first-child { padding-left: 0; }
.brief-col:last-child { padding-right: 0; }
.brief-col + .brief-col { border-left: 2px solid var(--divider); }
.col-head { margin: 0 0 4px; display: flex; justify-content: space-between; gap: 12px; font-size: 11px; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; }
.col-head.hot { color: var(--a700); }
.brief-item { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid var(--divider); background: none; color: inherit; text-align: left; cursor: pointer; }
.brief-item strong { font-size: 17px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; }
.brief-item span { font-size: 13px; color: var(--n700); }
.brief-item span.late { color: var(--a700); }
.brief-item:hover strong { color: var(--action); }
.more { padding: 14px 0; border: 0; background: none; color: var(--a700); font-size: 13px; font-weight: 600; cursor: pointer; }
.more:hover { text-decoration: underline; }
.brief-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px var(--gutter); border-top: 2px solid var(--divider); }
@media (max-width: 1000px) {
  .brief-hello > :first-child, .brief-hello > :last-child { grid-column: 1 / -1; }
  .pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .brief-cols { grid-template-columns: minmax(0, 1fr); }
  .brief-col, .brief-col:first-child, .brief-col:last-child { padding: 24px 0; }
  .brief-col + .brief-col { border-left: 0; border-top: 2px solid var(--divider); }
}
@media (max-width: 520px) { .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pipeline strong { font-size: 24px; } }

/* Resumo do dia (2b) */
.split { display: flex; flex-wrap: wrap; min-height: calc(100vh - 72px); }
.poster { flex: 5 1 340px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; padding: 36px var(--gutter); background: var(--action); color: var(--bg); }
.poster-main { margin-top: auto; display: flex; flex-direction: column; gap: 20px; }
.date { margin: 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.headline { margin: 0; max-width: 460px; font-size: clamp(20px, 2vw, 26px); font-weight: 600; line-height: 1.2; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-top: 16px; border-top: 2px solid var(--bg); font-size: 14px; }
.facts dd { margin: 0; font-weight: 800; }
.queue { flex: 7 1 520px; min-width: 0; display: flex; flex-direction: column; }
.queue-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; padding: 28px var(--gutter) 20px; border-bottom: 2px solid var(--divider); }
.tabs { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--field); }
.tabs button { padding: 9px 16px; border: 0; border-radius: 0; background: none; color: var(--text); font-size: 13px; cursor: pointer; }
.tabs button + button { border-left: 1px solid var(--field); }
.tabs button:hover { background: var(--n200); }
.tabs button[aria-selected="true"] { background: var(--action); color: var(--bg); font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0 var(--gutter); flex: 1; }
.item { display: grid; grid-template-columns: 72px minmax(0, 1fr) 170px; gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--divider); }
.item:focus { outline: 2px solid var(--accent); outline-offset: 4px; }
@media (max-width: 640px) { .item { grid-template-columns: 48px minmax(0, 1fr); } .side { grid-column: 2; } }
.num { font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em; color: var(--n600); }
.num.first { color: var(--a700); }
.item h2 { margin: 0 0 6px; font-size: 19px; font-weight: 800; line-height: 1.2; letter-spacing: -0.015em; }
.item p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--n800); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { padding: 3px 8px; font-size: 11px; }
.tag-stage { background: var(--a100); color: var(--a800); }
.tag-manual { background: var(--n200); color: var(--n800); }
.tag-ai { border: 1px solid var(--field); color: var(--n800); }
.tag-stale { background: var(--text); color: var(--bg); }
.side { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 13px; color: var(--n800); }
.side strong { color: var(--text); }
.side .btn { margin-top: 6px; min-height: 36px; padding: 6px 12px; font-size: 13px; }
.late { color: var(--a700); font-weight: 600; }
.queue-foot { padding: 16px var(--gutter); border-top: 2px solid var(--divider); }

/* Tabelas */
.table-wrap { overflow-x: auto; border-top: 2px solid var(--text); }
table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px; }
th { padding: 10px 12px 10px 0; border-bottom: 2px solid var(--divider); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; text-align: left; }
td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--divider); vertical-align: middle; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.cell-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; min-width: 260px; }
.inline-form .input { flex: 1 1 220px; min-height: 36px; }
.imp-steps { margin: 0; padding-left: 20px; font-size: 14px; color: var(--n800); }
.imp-texto { min-height: 160px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; white-space: pre; overflow-x: auto; }
.imp-previa { padding-top: 16px; border-top: 1px solid var(--divider); }
.imp-sum { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; font-size: 15px; font-weight: 400; }
.imp-sum strong { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.tag-ok { background: var(--n200); color: var(--text); }
.input-alert { border-color: var(--a700); }
.link-cliente { padding: 0; border: 0; background: none; color: var(--text); font: inherit; font-weight: 800; text-align: left; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--divider); cursor: pointer; }
.link-cliente:hover { color: var(--action); text-decoration-color: currentColor; }
.saude-ruim { background: var(--action); color: var(--bg); }
.saude-atencao { background: var(--a100); color: var(--a800); }
.saude-boa { background: var(--n200); color: var(--text); }
.ficha-topo { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px 24px; padding: 16px 0; border-top: 2px solid var(--text); border-bottom: 2px solid var(--divider); }
.ficha-topo dt, .ficha dt { font-size: 12px; color: var(--n700); }
.ficha-topo dd { margin: 4px 0 0; font-weight: 600; }
.ficha-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px 40px; }
.ficha-bloco { display: flex; flex-direction: column; gap: 12px; }
.ficha { margin: 0; display: flex; flex-direction: column; }
.ficha > div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--divider); }
.ficha dd { margin: 0; font-weight: 600; text-align: right; }
.texto-longo { margin: 0; white-space: pre-wrap; max-width: 72ch; }
.jornada { list-style: none; margin: 0; padding: 0; }
.jornada li { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--divider); }
.status { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
</style>

<body>
<div id="root"><p style="margin:48px;font:16px system-ui,sans-serif">Carregando o Onboardinho…</p></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
window.__onboardinhoIniciou = true;
// ============ Servidor ============
// Chama uma função api* do Code.gs e devolve uma Promise.
function chamar(nome) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, falha) {
    var runner = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      falha(new Error((e && e.message) || String(e)));
    });
    runner[nome].apply(runner, args);
  });
}

// ============ Utilitários de tela ============
var SEGMENTOS = { '6D': 'Clientes N2 · N3', '7D': 'Clientes N4 · N5', '8D': 'Clientes N6+' };
var ORDEM = ['6D', '7D', '8D'];
var PAPEIS = { onboarder: 'Onboarder', lideranca: 'Liderança' };
var ETAPAS = ['Pre Onboarding', 'Welcome', 'Product Migration', 'Ready for Activation', 'Activation & Monitoring', 'Faturamento', 'Accomplished', 'Unaccomplished'];
var ETAPAS_FINAIS = ['Accomplished', 'Unaccomplished'];

// Cria elementos com texto seguro (nunca innerHTML com dados).
function el(tag, attrs, filhos) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    var v = attrs[k];
    if (v === undefined || v === null || v === false) return;
    if (k === 'text') n.textContent = v;
    else if (k === 'class') n.className = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v;
    else n.setAttribute(k, v === true ? '' : v);
  });
  (filhos || []).forEach(function (f) {
    if (f === null || f === undefined || f === false) return;
    n.appendChild(typeof f === 'string' ? document.createTextNode(f) : f);
  });
  return n;
}
function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
function dias(iso) { return Math.max(0, Math.floor((new Date(S.agora).getTime() - new Date(iso).getTime()) / 86400000)); }
function data(iso) { return iso ? new Date(iso).toLocaleDateString('pt-BR') : ''; }
function nome(email) { return (S.nomes && S.nomes[email]) || email; }
function descPedido(p) {
  var segs = (p.segmentos || []).join(' + ');
  return p.tipo === 'papel' ? 'Papel → ' + PAPEIS[p.papel] + (segs ? ' (' + segs + ')' : '') : 'Segmentação → ' + segs;
}

var timerToast;
function avisar(msg, erro) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (erro ? ' erro' : '');
  t.setAttribute('role', erro ? 'alert' : 'status');
  t.hidden = false;
  clearTimeout(timerToast);
  timerToast = setTimeout(function () { t.hidden = true; }, erro ? 7000 : 3500);
}

// Executa uma ação no servidor: trava os botões, atualiza o estado e redesenha.
// Resolve com true se deu certo, false se deu erro (o erro já aparece para a pessoa).
var ocupado = false;
function agir(promessa, sucesso) {
  if (ocupado) return Promise.resolve(false);
  ocupado = true;
  document.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  return promessa.then(function (novo) {
    S = novo;
    ocupado = false;
    desenhar();
    if (sucesso) avisar(sucesso);
    return true;
  }).catch(function (e) {
    ocupado = false;
    desenhar();
    avisar(e.message, true);
    return false;
  });
}

// ============ Estado ============
var S = null; // estado vindo do servidor (apiEstado)
var UI = { pagina: 'inicio', aba: 'carteira', ajuste: null };

function podeLideranca() { return S.eu.admin || S.eu.papel === 'lideranca'; }

function clientesPorId() {
  var m = {};
  S.clientes.forEach(function (c) { m[c.id] = c; });
  return m;
}

function fila(aba) {
  var meus = clientesPorId();
  return S.orientacoes.filter(function (o) {
    if (o.status !== 'ativa') return false;
    if (aba === 'carteira') return o.escopo === 'cliente' && meus[o.cliente];
    if (aba === 'time') return o.escopo === 'segmento' && S.eu.segmentos.indexOf(o.segmento) >= 0;
    return o.escopo === 'geral';
  }).sort(function (a, b) { return a.prioridade - b.prioridade || a.titulo.localeCompare(b.titulo, 'pt-BR'); });
}

// ============ Telas ============
function desenhar() {
  var root = document.getElementById('root');
  root.textContent = '';
  if (!S) { root.appendChild(telaSimples('Carregando…', '')); return; }
  if (S.tela === 'sem-email') {
    root.appendChild(telaSimples('Não conseguimos identificar sua conta.',
      'Entre no navegador só com a sua conta Google da empresa e recarregue a página.'));
    return;
  }
  if (S.tela === 'sem-acesso') {
    root.appendChild(telaSimples('Você ainda não tem acesso.',
      'Sua conta (' + S.email + ') não está cadastrada no Onboardinho. Peça para o admin te cadastrar.'));
    return;
  }
  if (S.tela === 'primeiro-acesso' || UI.pagina === 'meu-acesso') { root.appendChild(telaAcesso()); return; }
  root.appendChild(telaApp());
}

function telaSimples(titulo, texto) {
  return el('div', { class: 'full-screen' }, [
    el('header', { class: 'full-head' }, [el('span', { class: 'brand', text: 'Onboardinho' })]),
    el('main', { class: 'full-main' }, [el('h1', { class: 'big', text: titulo }), texto ? el('p', { class: 'lead', text: texto }) : null])

}

        ]);
      }))),

function formAjuste() {
  var a = UI.ajuste;

    el('h1', { class: 'big', text: 'O que está diferente?' }),

      radio('tipo', 'segmentacao', 'Segmentação', a.tipo === 'segmentacao', function () { a.tipo = 'segmentacao'; a.segmentos = S.eu.segmentos.slice(); desenhar(); }),
      radio('tipo', 'papel', 'Papel', a.tipo === 'papel', function () { a.tipo = 'papel'; a.segmentos = S.eu.segmentos.slice(); desenhar(); })

    a.tipo === 'papel' ? el('fieldset', {}, [el('legend', { text: 'Qual deveria ser o seu papel?' })].concat(['onboarder', 'lideranca'].filter(function (p) { return p !== S.eu.papel; }).map(function (p) {

      return el('label', { class: 'check' }, [el('input', { type: unico ? 'radio' : 'checkbox', name: 'seg', value: s, checked: a.segmentos.indexOf(s) >= 0, onchange: function (e) {
        if (unico) a.segmentos = [s];

// ---------- App ----------
function telaApp() {

    ['inicio', 'Início', true],

function saudacao() {
  var hora = new Date().getHours();
  return (hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite') + ', ' + S.eu.nome.split(' ')[0] + '.';
}

/** Abre o Resumo do dia na aba certa e leva até a orientação, se houver. */
function abrirNoResumo(aba, idOrientacao) {
  UI.pagina = 'resumo';
  UI.aba = aba;

  var alvo = idOrientacao ? document.querySelector('[data-oid="' + CSS.escape(idOrientacao) + '"]') : document.getElementById('item-1');
  if (alvo) { alvo.scrollIntoView({ block: 'center' }); alvo.focus({ preventScroll: true }); }
  else window.scrollTo(0, 0);
}

/** Início (2a): o dia numa tela só. Etapas no topo, orientações em três colunas. */

  var eu = S.eu;
  var lider = podeLideranca();

  var time = fila('time');
  var carteira = fila('carteira');

  var vistos = {};
  var clientesHoje = carteira.filter(function (o) {
    if (vistos[o.cliente]) return false;
    vistos[o.cliente] = true;
    return true;
  });
  var total = gerais.length + time.length + carteira.length;
  var pendente = S.meusPedidos.filter(function (p) { return p.status === 'pendente'; })[0];

  var porEtapa = {};
  ETAPAS.forEach(function (et) { porEtapa[et] = 0; });
  S.clientes.forEach(function (c) { porEtapa[c.etapa] += 1; });
  // Destaque: a etapa em andamento com mais clientes (Accomplished/Unaccomplished já acabaram).
  var destaque = null;
  ETAPAS.filter(function (et) { return ETAPAS_FINAIS.indexOf(et) < 0; }).forEach(function (et) { if (porEtapa[et] > 0 && (!destaque || porEtapa[et] >= porEtapa[destaque])) destaque = et; });

  function meta(o) {
    var d = o.descricao.length > 90 ? o.descricao.slice(0, 88).trim() + '…' : o.descricao;

      el('h2', { class: 'col-head' + (quente ? ' hot' : '') }, [el('span', { text: titulo }), el('span', { text: String(itens.length) })]),
      itens.length === 0 ? el('p', { class: 'muted', style: 'padding: 14px 0', text: 'Nada por aqui hoje.' }) : null,
      el('div', {}, itens.slice(0, max).map(function (o) {
        var t = desenhoItem(o);
        return el('button', { type: 'button', class: 'brief-item', onclick: function () { abrirNoResumo(aba, o.id); } }, [
          el('strong', { text: t[0] }), t[1] ? el('span', { class: t[2] ? 'late' : null, text: t[1] }) : null
        ]);
      })),
      itens.length > max ? el('button', { type: 'button', class: 'more', onclick: function () { abrirNoResumo(aba); } }, [
        '+ ' + (aba === 'carteira' ? plural(itens.length - max, 'cliente', 'clientes') : plural(itens.length - max, 'orientação', 'orientações')) + ' ',
        el('span', { 'aria-hidden': 'true', text: '→' })

  return el('main', { class: 'brief' }, [
    el('div', { class: 'brief-hello' }, [
      el('div', {}, [
        el('p', { class: 'kicker', text: new Date(S.agora).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) }),
        el('h1', { class: 'brief-h1' }, [
          el('span', { text: saudacao() }),
          el('span', { text: total === 0 ? 'Nenhuma orientação para hoje.' : plural(total, 'orientação', 'orientações') + ' para hoje.' })
        ])
      ]),
      el('div', { class: 'brief-side' }, [
        el('div', { class: 'tags' }, [el('span', { class: 'tag tag-solid', text: (eu.segmentos.length > 1 ? 'Segmentos ' : 'Segmento ') + eu.segmentos.join(' + ') })]
          .concat(eu.segmentos.map(function (sg) { return el('span', { class: 'tag tag-outline', text: SEGMENTOS[sg] }); }))),
        el('p', { text: lider
          ? 'Números do time inteiro. As orientações seguem o manual e a etapa em que cada cliente está.'
          : 'As orientações seguem o manual do time e a etapa em que cada cliente seu está.' })
      ])
    ]),
    pendente ? el('p', { class: 'notice', style: 'margin: 0 var(--gutter) 20px', text: 'Seu pedido de ajuste está aguardando resposta: ' + descPedido(pendente) + '.' }) : null,
    el('ul', { class: 'pipeline', 'aria-label': (lider ? 'Clientes do time' : 'Seus clientes') + ' por etapa' }, ETAPAS.map(function (et) {
      var n = porEtapa[et];

    })),
    el('div', { class: 'brief-cols' }, [

      coluna(lider ? 'Clientes do time hoje' : 'Seus clientes hoje', clientesHoje, 'carteira', function (o) {

        return [c.nome + ': ' + o.titulo, c.etapa + ' · ' + plural(d, 'dia', 'dias') + ' na etapa', d > 10];

    ]),
    el('div', { class: 'brief-foot' }, [
      el('button', { class: 'btn btn-primary btn-wide', type: 'button', onclick: function () { abrirNoResumo('carteira'); } },
        ['Começar pelos clientes', el('span', { 'aria-hidden': 'true', text: '→' })]),
      el('p', { class: 'muted', text: 'O Resumo do dia mostra a fila completa, em ordem de urgência.' })
    ])

}

        })),

      }))

    linhas.length > 300 ? el('p', { class: 'muted', text: 'Mostrando 300 de ' + linhas.length + ' linhas (os problemas aparecem primeiro).' }) : null,
    el('div', { class: 'actions' }, [
      el('button', { class: 'btn btn-primary btn-wide', type: 'button', disabled: entram ? null : true, onclick: importar },
        [entram ? 'Importar (' + entram + ')' : 'Nada para importar', el('span', { 'aria-hidden': 'true', text: '→' })]),
      el('button', { class: 'btn btn-secondary', type: 'button', text: 'Limpar', onclick: function () { UI.imp = null; desenhar(); } })

}

function formCliente() {
  var segs = S.segmentosCadastro;
  var f = UI.cliente || (UI.cliente = { idExterno: '', nome: '', segmento: segs[0], responsavelEmail: '', etapa: ETAPAS[0], desde: hojeLocal() });

  return el('form', { class: 'form', onsubmit: function (e) {

    agir(chamar('apiAdicionarCliente', dados), f.nome + ' foi adicionado.').then(function (ok) {
      if (ok) { UI.cliente = { idExterno: '', nome: '', segmento: f.segmento, responsavelEmail: f.responsavelEmail, etapa: f.etapa, desde: f.desde }; desenhar(); }

    el('div', { class: 'field' }, [el('label', { for: 'c-nome', text: 'Nome do cliente' }), el('input', { id: 'c-nome', class: 'input', required: true, maxlength: '140', value: f.nome, oninput: function (e) { f.nome = e.target.value; } })]),
    el('div', { class: 'field' }, [el('label', { for: 'c-id', text: 'Hotmart ID (opcional)' }), el('input', { id: 'c-id', class: 'input', maxlength: '60', value: f.idExterno, oninput: function (e) { f.idExterno = e.target.value; } })]),
    el('div', { class: 'field' }, [el('label', { for: 'c-seg', text: 'Segmento' }),
      el('select', { id: 'c-seg', class: 'input', onchange: function (e) { f.segmento = e.target.value; f.responsavelEmail = ''; desenhar(); } }, segs.map(function (sg) {
        return el('option', { value: sg, selected: sg === f.segmento ? 'selected' : null, text: sg + ' · ' + SEGMENTOS[sg] });
      }))]),
    el('div', { class: 'field' }, [el('label', { for: 'c-resp', text: 'Responsável (opcional)' }),
      el('select', { id: 'c-resp', class: 'input', onchange: function (e) { f.responsavelEmail = e.target.value; } },
        [el('option', { value: '', text: doSeg.length ? 'Sem responsável por enquanto' : 'Nenhum onboarder ' + f.segmento + ' cadastrado ainda' })].concat(doSeg.map(function (r) {

    el('div', { class: 'full actions' }, [el('button', { class: 'btn btn-primary', type: 'submit', text: 'Adicionar cliente' })])
  ]);
}

/** Responsável na tabela: liderança do segmento e admin escolhem; os outros só veem. */
function celulaResponsavel(c) {
  if (!c.podeAtribuir) return c.responsavelEmail ? el('span', { text: nome(c.responsavelEmail) }) : el('span', { class: 'muted', text: 'Sem responsável' });
  var opcoes = S.responsaveis.filter(function (r) { return r.segmento === c.segmento; });
  var conhecido = opcoes.some(function (r) { return r.email === c.responsavelEmail; });
  return el('select', { class: 'input' + (c.semDono ? ' input-alert' : ''), 'aria-label': 'Responsável por ' + c.nome, onchange: function (e) {
    var v = e.target.value;
    agir(chamar('apiMudarResponsavel', c.id, v), v ? c.nome + ' agora é de ' + nome(v) + '.' : c.nome + ' ficou sem responsável.');
  } }, [el('option', { value: '', selected: c.responsavelEmail ? null : 'selected', text: 'Sem responsável' })]
    .concat(c.responsavelEmail && !conhecido ? [el('option', { value: c.responsavelEmail, selected: 'selected', text: nome(c.responsavelEmail) + ' (precisa ajustar)' })] : [])
    .concat(opcoes.map(function (r) { return el('option', { value: r.email, selected: r.email === c.responsavelEmail ? 'selected' : null, text: r.nome }); })));
}

function paginaOrientacao() {
  var eu = S.eu;
  var f = UI.form || (UI.form = { escopo: eu.admin ? 'geral' : 'segmento', segmento: eu.segmentos[0], cliente: '', etapa: '', prioridade: '2', titulo: '', descricao: '', refManual: '' });
  var meusSegs = eu.admin ? ORDEM : eu.segmentos;
  var clientes = S.clientes.filter(function (c) { return eu.admin || eu.segmentos.indexOf(c.segmento) >= 0; });
  var escopos = [['geral', 'Todos os times', eu.admin], ['segmento', 'Um segmento', true], ['cliente', 'Um cliente', true]].filter(function (e) { return e[2]; });
  function campo(id, rotulo, input) { return el('div', { class: 'field' }, [el('label', { for: id, text: rotulo }), input]); }
  function sel(id, valor, opcoes, onchange) {
    return el('select', { id: id, class: 'input', onchange: function (e) { onchange(e.target.value); } }, opcoes.map(function (o) {
      return el('option', { value: o[0], selected: o[0] === valor ? 'selected' : null, text: o[1] });
    }));
  }
  return el('main', { class: 'page' }, [
    el('div', { class: 'stack' }, [
      el('p', { class: 'kicker', text: 'Orientação do manual' }),
      el('h1', { class: 'title', text: 'Nova orientação' }),
      el('p', { class: 'lead', text: 'Ela entra na fila da página inicial de quem é afetado, ordenada pela prioridade.' })
    ]),
    el('form', { class: 'form panel', onsubmit: function (e) {
      e.preventDefault();
      agir(chamar('apiCriarOrientacao', f), 'Orientação publicada.').then(function (ok) {
        if (ok) { UI.form = null; desenhar(); }
      });
    } }, [
      el('fieldset', { class: 'full' }, [el('legend', { text: 'Para quem vale' })].concat(escopos.map(function (e) {
        return el('label', { class: 'check' }, [el('input', { type: 'radio', name: 'escopo', value: e[0], checked: f.escopo === e[0], onchange: function () { f.escopo = e[0]; desenhar(); } }), e[1]]);
      }))),
      f.escopo === 'segmento' ? campo('f-seg', 'Segmento', sel('f-seg', f.segmento, meusSegs.map(function (s) { return [s, s + ' · ' + SEGMENTOS[s]]; }), function (v) { f.segmento = v; })) : null,
      f.escopo === 'cliente' ? campo('f-cli', 'Cliente', sel('f-cli', f.cliente, [['', 'Escolha…']].concat(clientes.map(function (c) { return [c.id, c.nome + ' (' + c.segmento + ')']; })), function (v) { f.cliente = v; })) : null,
      campo('f-etapa', 'Etapa (opcional)', sel('f-etapa', f.etapa, [['', 'Qualquer etapa']].concat(ETAPAS.map(function (e) { return [e, e]; })), function (v) { f.etapa = v; })),
      campo('f-prio', 'Prioridade', sel('f-prio', f.prioridade, [['1', '1 · urgente'], ['2', '2 · alta'], ['3', '3 · normal'], ['4', '4 · baixa']], function (v) { f.prioridade = v; })),
      el('div', { class: 'field full' }, [el('label', { for: 'f-titulo', text: 'Título' }), el('input', { id: 'f-titulo', class: 'input', required: true, maxlength: '140', value: f.titulo, oninput: function (e) { f.titulo = e.target.value; } })]),
      el('div', { class: 'field full' }, [el('label', { for: 'f-desc', text: 'O que fazer' }), el('textarea', { id: 'f-desc', class: 'input', maxlength: '1000', oninput: function (e) { f.descricao = e.target.value; } }, [f.descricao])]),
      el('div', { class: 'field' }, [el('label', { for: 'f-ref', text: 'Seção do manual' }), el('input', { id: 'f-ref', class: 'input', placeholder: 'Ex.: Manual 7D §5.1', maxlength: '80', value: f.refManual, oninput: function (e) { f.refManual = e.target.value; } })]),
      el('div', { class: 'full actions' }, [el('button', { class: 'btn btn-primary btn-wide', type: 'submit' }, ['Publicar orientação', el('span', { 'aria-hidden': 'true', text: '→' })])])
    ])
  ]);
}

function paginaPedidos() {
  return el('main', { class: 'page' }, [
    el('div', { class: 'stack' }, [
      el('p', { class: 'kicker', text: 'Pedidos de ajuste de acesso' }),

    el('form', { class: 'form panel', onsubmit: function (e) {

      }))),
      el('fieldset', {}, [el('legend', { text: f.papel === 'onboarder' ? 'Segmentação (uma)' : 'Segmentações' })].concat(ORDEM.map(function (s) {
        return el('label', { class: 'check' }, [el('input', { type: f.papel === 'onboarder' ? 'radio' : 'checkbox', name: 'u-seg', value: s, checked: f.segmentos.indexOf(s) >= 0, onchange: function (e) {

        el('thead', {}, [el('tr', {}, ['Nome', 'Papel', 'Segmentação', 'Liberado por', 'Status'].map(function (h) { return el('th', { text: h }); }))]),
        el('tbody', {}, S.usuarios.map(function (u) {

            el('td', { text: PAPEIS[u.papel] + (u.admin ? ' · Admin' : '') }),
            el('td', { text: u.segmentos.join(' + ') }),
            el('td', { class: 'muted', text: nome(u.liberadoPor) }),

}

desenhar();
